name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.0.0) — required for manual run"
        required: true
        type: string
      publish_builder_draft:
        description: "Also attach GameloopFix-Builder.zip to a draft release (maintainer only)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build patched files
        run: python build_patched.py

      - name: Pack release zips
        run: python scripts/pack_release.py --target all

      - name: Resolve version tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create public release (installer + payload)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          gh release create "$TAG" \
            --title "GameLoop Fix $TAG" \
            --notes "Download **GameloopFix-Installer.zip**, extract, and run Install-GameloopFix.bat as Administrator. The installer downloads patched files automatically." \
            dist/GameloopFix-Installer.zip \
            dist/gameloop-fix-payload.zip

      - name: Create draft builder release (maintainer only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish_builder_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}-builder"
          gh release create "$TAG" \
            --draft \
            --title "Builder $TAG (maintainer)" \
            --notes "Draft release — only repo collaborators can see/download this. Full maintainer toolkit: Official-Files, scripts, Fixed-Assets, build tools." \
            dist/GameloopFix-Builder.zip
